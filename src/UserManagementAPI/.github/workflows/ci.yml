# GitHub Actions CI workflow for local/PR validation.
name: user-management-api-ci

on:
  pull_request:
    paths:
      - "src/UserManagementAPI/**"
  push:
    branches: ["main"]
    paths:
      - "src/UserManagementAPI/**"

jobs:
  build-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/UserManagementAPI
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync dependencies
        run: uv sync

      - name: Lint
        run: uv run ruff check app tests

      - name: Test
        run: uv run pytest -q
