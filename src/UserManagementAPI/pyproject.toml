# This file defines Python packaging metadata and dependencies for the User Management API.
[project]
name = "user-management-api"
version = "0.1.0"
description = "FastAPI microservice scaffold for user management."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116.1,<1.0.0",
  "uvicorn[standard]>=0.35.0,<1.0.0",
  "pydantic>=2.11.9,<3.0.0",
  "pydantic-settings>=2.11.0,<3.0.0",
  "sqlalchemy[asyncio]>=2.0.43,<3.0.0",
  "asyncpg>=0.30.0,<1.0.0",
  "alembic>=1.16.5,<2.0.0",
  "PyJWT>=2.10.1,<3.0.0",
  "passlib[bcrypt]>=1.7.4,<2.0.0",
  "python-multipart>=0.0.20,<1.0.0",
  "email-validator>=2.3.0,<3.0.0",
  "structlog>=25.4.0,<26.0.0",
  "redis>=6.4.0,<7.0.0",
]

# Development-only dependencies (linting, tests, and local quality checks).
[dependency-groups]
dev = [
  "pytest>=8.4.2,<9.0.0",
  "pytest-asyncio>=1.2.0,<2.0.0",
  "pytest-cov>=7.0.0,<8.0.0",
  "httpx>=0.28.1,<1.0.0",
  "ruff>=0.13.0,<1.0.0",
  "mypy>=1.18.2,<2.0.0",
  "pre-commit>=4.3.0,<5.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# pytest configuration for async tests and project test discovery.
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

# Ruff linter baseline configuration.
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
