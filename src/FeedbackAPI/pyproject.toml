[project]
name = "feedbackapi"
version = "0.1.0"
description = "FeedbackAPI service scaffold"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116.0,<1.0.0",
  "uvicorn[standard]>=0.35.0,<1.0.0",
  "pydantic-settings>=2.10.1,<3.0.0",
  "azure-identity>=1.24.0,<2.0.0",
  "azure-cosmos>=4.9.0,<5.0.0",
  "azure-storage-blob>=12.27.0,<13.0.0",
]

[dependency-groups]
dev = [
  "pytest>=8.4.0,<9.0.0",
  "pytest-asyncio>=1.1.0,<2.0.0",
  "httpx>=0.28.1,<1.0.0",
  "ruff>=0.12.12,<1.0.0",
  "mypy>=1.18.1,<2.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

