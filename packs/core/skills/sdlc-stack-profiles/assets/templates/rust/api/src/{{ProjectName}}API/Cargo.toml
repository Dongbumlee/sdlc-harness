[package]
name = "{{project-name}}"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"

[lib]
name = "{{CrateName}}"
path = "src/lib.rs"

[[bin]]
name = "{{project-name}}"
path = "src/main.rs"

[dependencies]
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }
tower = { version = "0.5", features = ["util"] }
