# Bundled default template — rust / api
# Instantiation: copy this tree to the repository root, substitute the
# tokens below in file names and contents, delete template.yaml, then run
# the verify steps. Cargo.lock is generated by the install step, never
# templated. See the sdlc-stack-profiles skill ("Bundled default
# templates").
id: rust/api
profile: rust
kind: api
project_dirs:
  - src/{{ProjectName}}API
tokens:
  - name: ProjectName
    description: PascalCase base name of the product or service, e.g. TaskTracker
    default: Sample
  - name: project-name
    description: kebab-case name derived from ProjectName, e.g. task-tracker — used for the Cargo package and binary names
    default: sample
  - name: CrateName
    description: Snake-case library crate name derived from ProjectName, e.g. task_tracker
    default: sample
  - name: Year
    description: Four-digit year written into the LICENSE copyright line at instantiation (use the current year)
    default: 2026
verify:
  - step: install
    cwd: src/{{ProjectName}}API
    command: cargo fetch
  - step: build
    cwd: src/{{ProjectName}}API
    command: cargo build
  - step: test
    cwd: src/{{ProjectName}}API
    command: cargo test
