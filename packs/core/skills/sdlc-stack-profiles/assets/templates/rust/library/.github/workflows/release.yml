name: Release

# Publishing happens only from a release tag, and only after the
# packaged crate passes a consumer smoke test in a clean project.
# crates.io trusted publishing (OIDC) exchanges the workflow's identity
# token for a short-lived publish token — no stored registry secret.
# One-time setup: the first publish is manual (cargo publish with a
# personal token) so the crate exists; then configure the trusted
# publisher for this repository + workflow on crates.io and delete the
# token.

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/{{ProjectName}}Lib
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt, clippy
      - name: Verify the tag matches the crate version
        run: |
          VERSION="$(grep -m1 '^version' Cargo.toml | sed 's/.*"\(.*\)".*/\1/')"
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match Cargo.toml version $VERSION."
            exit 1
          fi
      - name: Verify format, lint, tests
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test
      - name: Package the crate
        run: cargo package
      - name: Consumer smoke test (clean project, packaged crate)
        run: |
          SMOKE="$RUNNER_TEMP/smoke"
          cargo new "$SMOKE" --bin
          CRATE_FILE="$(ls target/package/{{project-name}}-*.crate)"
          mkdir -p "$SMOKE/vendor"
          tar -xzf "$CRATE_FILE" -C "$SMOKE/vendor"
          PKG_DIR="$(ls -d "$SMOKE"/vendor/{{project-name}}-*)"
          printf '\n{{project-name}} = { path = "%s" }\n' "$PKG_DIR" >> "$SMOKE/Cargo.toml"
          cat > "$SMOKE/src/main.rs" <<'EOF'
          fn main() {
              assert_eq!({{CrateName}}::slugify("Hello, World!"), "hello-world");
              println!("consumer smoke ok");
          }
          EOF
          (cd "$SMOKE" && cargo run --quiet)
      - name: Publish to crates.io (trusted publishing)
        uses: rust-lang/crates-io-auth-action@v1
        id: auth
      - name: Cargo publish
        run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
      - name: Extract release notes from CHANGELOG.md
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" { found=1; next }
            found && /^## \[/ { exit }
            found { print }
          ' "${{ github.workspace }}/CHANGELOG.md" > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "::error::No CHANGELOG.md section for version $VERSION. Move the Unreleased entries under a '## [$VERSION] - YYYY-MM-DD' heading before tagging."
            exit 1
          fi
      - name: Create GitHub Release
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file release-notes.md
        env:
          GH_TOKEN: ${{ github.token }}
