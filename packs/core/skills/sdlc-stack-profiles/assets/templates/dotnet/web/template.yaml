# Bundled default template — dotnet / web
# Instantiation: copy this tree to the repository root, substitute the
# tokens below in file names and contents, delete template.yaml, then run
# the verify steps. Lock files are generated by the install step, never
# templated. The web app follows the web standard in the
# sdlc-stack-profiles skill ("Web type — the browser is untrusted"):
# server-rendered pages, environment configuration split structurally
# into browser-safe public values and server-only secrets, and the
# WCAG 2.2 AA markup floor.
id: dotnet/web
profile: dotnet
kind: web
project_dirs:
  - src/{{ProjectName}}Web
  - src/{{ProjectName}}Web.Tests
tokens:
  - name: ProjectName
    description: PascalCase base name of the product, e.g. TaskTracker
    default: Sample
  - name: project-name
    description: kebab-case name derived from ProjectName, e.g. task-tracker
    default: sample
  - name: Year
    description: Four-digit year written into the LICENSE copyright line at instantiation (use the current year)
    default: 2026
verify:
  - step: install
    cwd: .
    command: dotnet restore {{ProjectName}}.sln
  - step: build
    cwd: .
    command: dotnet build {{ProjectName}}.sln -c Release
  - step: test
    cwd: .
    command: dotnet test {{ProjectName}}.sln -c Release
