# Bundled default template — python / api
# Instantiation: copy this tree to the repository root, substitute the
# tokens below in file names and contents, delete template.yaml, then run
# the verify steps. Lock files are generated by the install step, never
# templated. See the sdlc-stack-profiles skill ("Bundled default templates").
id: python/api
profile: python
kind: api
project_dirs:
  - src/{{ProjectName}}API
tokens:
  - name: ProjectName
    description: PascalCase base name of the product or service, e.g. TaskTracker
    default: Sample
  - name: project-name
    description: kebab-case distribution name derived from ProjectName, e.g. task-tracker
    default: sample
  - name: Year
    description: Four-digit year written into the LICENSE copyright line at instantiation (use the current year)
    default: 2026
verify:
  - step: install
    cwd: src/{{ProjectName}}API
    command: uv sync
  - step: build
    cwd: src/{{ProjectName}}API
    command: uv sync --frozen
  - step: test
    cwd: src/{{ProjectName}}API
    command: uv run pytest --cov
