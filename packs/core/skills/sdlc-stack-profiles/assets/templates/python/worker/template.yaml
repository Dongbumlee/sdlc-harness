# Bundled default template — python / worker
# Instantiation: copy this tree to the repository root, substitute the
# tokens below in file names and contents, delete template.yaml, then run
# the verify steps. The worker follows the worker standard in the
# sdlc-stack-profiles skill ("Worker type — correctness under
# redelivery"): at-least-once delivery assumed, an idempotency key with
# a unique constraint applied in the same transaction as the effect, a
# transactional outbox, classified retries with backoff and jitter, and
# a dead-letter queue with replay from day one.
id: python/worker
profile: python
kind: worker
project_dirs:
  - src/{{ProjectName}}Worker
tokens:
  - name: ProjectName
    description: PascalCase base name of the product or service, e.g. TaskTracker
    default: Sample
  - name: project-name
    description: kebab-case distribution name derived from ProjectName, e.g. task-tracker
    default: sample
  - name: Year
    description: Four-digit year written into the LICENSE copyright line at instantiation (use the current year)
    default: 2026
verify:
  - step: install
    cwd: src/{{ProjectName}}Worker
    command: uv sync
  - step: build
    cwd: src/{{ProjectName}}Worker
    command: uv sync --frozen
  - step: test
    cwd: src/{{ProjectName}}Worker
    command: uv run pytest
