[project]
name = "{{project-name}}"
version = "0.1.0"
description = "{{ProjectName}} worker"
requires-python = ">=3.12"
# The worker standard needs no third-party runtime packages: the job
# store is SQLite from the standard library, so the shipped artefact
# is exactly the tested artefact and the supply chain stays empty.
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.4.0",
    "pytest-cov>=6.2.1",
    "ruff>=0.8.0",
]

# Ruff is the pinned formatter + linter for every Python project.
# CI runs `ruff check` and `ruff format --check`; there is no second
# formatter and no per-project rule shopping.
[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = ["--import-mode=importlib"]
testpaths = ["tests"]

[tool.coverage.run]
source = ["app"]
