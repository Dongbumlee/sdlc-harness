# Bundled default template — python / cli
# Instantiation: copy this tree to the repository root, substitute the
# tokens below in file names and contents, delete template.yaml, then run
# the verify steps. The CLI follows the cli standard in the
# sdlc-stack-profiles skill ("CLI type — the interface is the
# contract"): Click parsing, data to stdout and diagnostics to stderr, a
# documented exit-code map, golden-file and exit-code tests, and
# PyInstaller + PyPI tag releases in the same artefact shape as every
# other stack. Lock files are generated by the install step, never
# templated.
id: python/cli
profile: python
kind: cli
project_dirs:
  - src/{{project_name}}
tokens:
  - name: ProjectName
    description: PascalCase base name of the product or service, e.g. TaskTracker
    default: Sample
  - name: project-name
    description: kebab-case name derived from ProjectName, e.g. task-tracker — used for the distribution and command names
    default: sample
  - name: project_name
    description: snake_case import name, used by python/cli
    default: sample
  - name: Year
    description: Four-digit year written into the LICENSE copyright line at instantiation (use the current year)
    default: 2026
verify:
  - step: install
    cwd: .
    command: uv sync
  - step: build
    cwd: .
    command: uv build
  - step: test
    cwd: .
    command: uv run pytest
