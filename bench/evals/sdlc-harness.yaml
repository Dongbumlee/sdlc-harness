skill: sdlc-harness
description: >-
  The harness entry skill must fire when the user asks for the full SDLC lifecycle — a new feature or project run end to end, or a bug fix through the formal workflow — and stay quiet for single-phase asks (scaffolding alone, requirements discovery alone, implementation alone), which belong to the phase skills.
cases:
  - name: build-from-scratch-full-process
    category: trigger
    prompt: "Build a new task tracker app from scratch, full process."
    expect:
      skill_invoked: true
  - name: scaffold-typescript-service
    category: trigger
    prompt: "Scaffold a new TypeScript service with CI and a Dockerfile."
    expect:
      skill_invoked: false
  - name: vague-idea-requirements
    category: trigger
    prompt: "I have a vague idea for an app — help me figure out the requirements."
    expect:
      skill_invoked: false
  - name: start-full-sdlc-run
    category: trigger
    prompt: "Start the full SDLC run for the payments feature."
    expect:
      skill_invoked: true
  - name: bugfix-formal-workflow
    category: trigger
    prompt: "Fix this bug through the formal workflow."
    expect:
      skill_invoked: true
  - name: scaffold-then-lifecycle
    category: trigger
    prompt: "Create the project scaffolding and then run the whole lifecycle end to end."
    expect:
      skill_invoked: true
  - name: write-login-endpoint
    category: trigger
    prompt: "Write the code for the login endpoint."
    expect:
      skill_invoked: false
