# Canary: Spring Boot Thymeleaf Web Scaffolding
id: scf-021-java-web
version: "1.0"
phase: scaffold
title: "Spring Boot Thymeleaf Web Scaffolding"
description: >
  Tests the AI agent's ability to scaffold a server-rendered web
  app with the harness java profile structure: Spring Boot with
  Thymeleaf, the structural public/server configuration split,
  a health endpoint, and page tests.

prompt: |
  You are a senior Java engineer. Scaffold a server-rendered web
  application (an item catalog) with the following specifications:

  Project Requirements:
  - Java 21, Spring Boot with Thymeleaf server-rendered pages,
    Maven (./mvnw); the project lives in `src/<Name>Web`
  - Server-side rendering first; forms follow post/redirect/get
  - The browser is untrusted: configuration is split structurally
    into public (browser-safe) and server-only values

  Expected Project Structure:
  1. pom.xml with Spring Boot web + Thymeleaf and JUnit 5; the
     application entry class (<Name>Application) in the base
     package
  2. Packages by role: web (ItemsController, HealthController),
     service (an ItemStore seam), model (Item), config
     (PublicProperties and ServerProperties as separate
     configuration-properties types)
  3. Thymeleaf templates under src/main/resources/templates
     (index.html for the items page: list + add form)
  4. The add form posts and redirects (303); the health
     controller serves the liveness endpoint
  5. Configuration split: server secrets bind only to
     ServerProperties and never reach a template — a
     sentinel-secret test proves it
  6. A multi-stage Dockerfile (Maven build stage, Temurin JRE
     runtime, non-root user)
  7. Tests: page tests over the real pipeline (the items page
     renders, the add form round-trips through post/redirect/get),
     the config boundary test, and accessibility-floor assertions
     on the rendered markup
  8. A GitHub Actions CI workflow that builds and tests with
     ./mvnw

  For each file generated, include appropriate comments explaining
  the purpose. Ensure `./mvnw verify` passes out of the box.

expected:
  keywords:
    - Spring Boot
    - Thymeleaf
    - pom.xml
    - mvnw
    - health
    - Dockerfile
  graders:
    - type: keyword
      weight: 0.3
      config:
        required:
          - Spring Boot
          - Thymeleaf
          - pom.xml
          - mvnw
          - health
          - configuration
          - Dockerfile
        forbidden: ["TODO", "placeholder"]
    - type: structural
      weight: 0.3
      config:
        required_sections:
          - project structure
          - configuration
          - entry point
          - testing
          - containerization
    - type: llm-judge
      weight: 0.4
      config:
        criteria:
          - completeness
          - technical_accuracy
          - clarity
          - production_readiness
          - best_practices

timeout_seconds: 120
tags:
  - scaffold
  - java
  - web
  - spring-boot
  - project-structure
