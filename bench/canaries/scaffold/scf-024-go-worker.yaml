# Canary: Go Worker Scaffolding
id: scf-024-go-worker
version: "1.0"
phase: scaffold
title: "Go Worker Scaffolding"
description: >
  Tests the AI agent's ability to scaffold a background worker
  with the harness go profile structure, built for correctness
  under redelivery: idempotency, a transactional outbox,
  classified retries, and a dead-letter queue with replay.

prompt: |
  You are a senior Go engineer. Scaffold a background worker
  service (an invoice-import worker) with the following
  specifications:

  Project Requirements:
  - Go modules; the worker project lives in `src/<Name>Worker`
    with the entry point under cmd/<project-name>
  - Delivery is at-least-once: the worker must stay correct when
    the same job is delivered twice
  - The job store is SQLite, claimed with a lease

  Expected Project Structure:
  1. go.mod; the jobs package under internal/jobs: store.go (the
     SQLite job store), handlers.go (job handlers), worker.go
     (poll, claim, dispatch); main.go only wires and runs
  2. Idempotency: every job carries an idempotency key with a
     UNIQUE constraint, applied in the same transaction as the
     job's effect
  3. A transactional outbox: outbound effects are written in the
     same transaction as the state change and published after
  4. Failure handling: permanent failures go straight to the
     dead-letter state; transient failures retry with exponential
     backoff and full jitter (base 1s, cap 60s, max 5 attempts);
     the dead-letter queue has an alarm and a replay path from
     day one
  5. A sample job (slugify) demonstrating the handler shape
  6. A multi-stage Dockerfile (Go build stage, distroless
     nonroot runtime)
  7. Tests: the worker contract set — the defining tests include
     redelivery idempotency, lease expiry reclaim, backoff
     classification, and dead-letter replay, run against a fake
     clock where time matters
  8. A GitHub Actions CI workflow that runs go vet, golangci-lint,
     and `go test ./...`

  For each file generated, include appropriate comments explaining
  the purpose. Ensure `go test ./...` passes out of the box.

expected:
  keywords:
    - go.mod
    - store.go
    - idempotency
    - outbox
    - dead-letter
    - SQLite
    - Dockerfile
  graders:
    - type: keyword
      weight: 0.3
      config:
        required:
          - go.mod
          - store.go
          - handlers.go
          - idempotency
          - dead-letter
          - SQLite
          - go test
        forbidden: ["TODO", "placeholder"]
    - type: structural
      weight: 0.3
      config:
        required_sections:
          - project structure
          - configuration
          - entry point
          - testing
          - containerization
    - type: llm-judge
      weight: 0.4
      config:
        criteria:
          - completeness
          - technical_accuracy
          - clarity
          - production_readiness
          - best_practices

timeout_seconds: 120
tags:
  - scaffold
  - go
  - worker
  - project-structure
