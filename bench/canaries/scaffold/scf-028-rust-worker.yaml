# Canary: Rust Worker Scaffolding
id: scf-028-rust-worker
version: "1.0"
phase: scaffold
title: "Rust Worker Scaffolding"
description: >
  Tests the AI agent's ability to scaffold a background worker
  with the harness rust profile structure, built for correctness
  under redelivery: idempotency, a transactional outbox,
  classified retries, and a dead-letter queue with replay.

prompt: |
  You are a senior Rust engineer. Scaffold a background worker
  service (an invoice-import worker) with the following
  specifications:

  Project Requirements:
  - Cargo; the worker crate lives in `src/<Name>Worker`
  - Delivery is at-least-once: the worker must stay correct when
    the same job is delivered twice
  - The job store is SQLite, claimed with a lease

  Expected Project Structure:
  1. Cargo.toml; the crate split by role: src/main.rs (entry
     point), src/worker.rs (poll, claim, dispatch), src/store.rs
     (the SQLite job store), src/handlers.rs (job handlers),
     src/lib.rs exposing the modules to tests
  2. Idempotency: every job carries an idempotency key with a
     UNIQUE constraint, applied in the same transaction as the
     job's effect
  3. A transactional outbox: outbound effects are written in the
     same transaction as the state change and published after
  4. Failure handling: permanent failures go straight to the
     dead-letter state; transient failures retry with exponential
     backoff and full jitter (base 1s, cap 60s, max 5 attempts);
     the dead-letter queue has an alarm and a replay path from
     day one
  5. A sample job (slugify) demonstrating the handler shape
  6. A multi-stage Dockerfile (Rust build stage, slim Debian
     runtime, non-root user)
  7. Tests: the worker contract set (tests/worker_test.rs) —
     the defining tests include redelivery idempotency, lease
     expiry reclaim, backoff classification, and dead-letter
     replay, run against a fake clock where time matters
  8. A GitHub Actions CI workflow that runs cargo build,
     cargo test, clippy with warnings denied, and a rustfmt check

  For each file generated, include appropriate comments explaining
  the purpose. Ensure `cargo test` passes out of the box.

expected:
  keywords:
    - Cargo.toml
    - worker.rs
    - store.rs
    - idempotency
    - dead-letter
    - SQLite
    - Dockerfile
  graders:
    - type: keyword
      weight: 0.3
      config:
        required:
          - Cargo.toml
          - worker.rs
          - store.rs
          - handlers.rs
          - idempotency
          - outbox
          - dead-letter
          - SQLite
        forbidden: ["TODO", "placeholder"]
    - type: structural
      weight: 0.3
      config:
        required_sections:
          - project structure
          - configuration
          - entry point
          - testing
          - containerization
    - type: llm-judge
      weight: 0.4
      config:
        criteria:
          - completeness
          - technical_accuracy
          - clarity
          - production_readiness
          - best_practices

timeout_seconds: 120
tags:
  - scaffold
  - rust
  - worker
  - project-structure
