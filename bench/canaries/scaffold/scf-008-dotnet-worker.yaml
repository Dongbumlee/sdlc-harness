# Canary: .NET Worker Scaffolding
id: scf-008-dotnet-worker
version: "1.0"
phase: scaffold
title: ".NET Worker Scaffolding"
description: >
  Tests the AI agent's ability to scaffold a background worker
  with the harness dotnet profile structure, built for correctness
  under redelivery: idempotency, a transactional outbox,
  classified retries, and a dead-letter queue with replay.

prompt: |
  You are a senior .NET engineer. Scaffold a background worker
  service (an invoice-import worker) with the following
  specifications:

  Project Requirements:
  - .NET 10 worker host (generic host, BackgroundService),
    solution layout with the worker and its test project under
    `src/`
  - Delivery is at-least-once: the worker must stay correct when
    the same job is delivered twice
  - The job store is SQLite, claimed with a lease

  Expected Project Structure:
  1. A solution (.sln) with `src/<Name>Worker` and
     `src/<Name>Worker.Tests`
  2. A Jobs layer: the job store (claim = lease with expiry), job
     handlers, and the worker loop that polls, claims, and
     dispatches
  3. Idempotency: every job carries an idempotency key with a
     UNIQUE constraint, applied in the same transaction as the
     job's effect
  4. A transactional outbox: outbound effects are written in the
     same transaction as the state change and published after
  5. Failure handling: permanent failures go straight to the
     dead-letter state; transient failures retry with exponential
     backoff and full jitter (base 1s, cap 60s, max 5 attempts);
     the dead-letter queue has an alarm and a replay path from
     day one
  6. A sample job (slugify) demonstrating the handler shape
  7. A Dockerfile for the worker project
  8. Tests: the worker contract set — the defining tests include
     redelivery idempotency, lease expiry reclaim, backoff
     classification, and dead-letter replay, run against a fake
     clock where time matters
  9. A GitHub Actions CI workflow that restores, builds, and tests
     the solution

  For each file generated, include appropriate comments explaining
  the purpose. Ensure `dotnet test` passes out of the box.

expected:
  keywords:
    - BackgroundService
    - idempotency
    - outbox
    - dead-letter
    - SQLite
    - Dockerfile
    - dotnet test
  graders:
    - type: keyword
      weight: 0.3
      config:
        required:
          - BackgroundService
          - idempotency
          - outbox
          - dead-letter
          - SQLite
          - dotnet test
        forbidden: ["TODO", "placeholder"]
    - type: structural
      weight: 0.3
      config:
        required_sections:
          - project structure
          - configuration
          - entry point
          - testing
          - containerization
    - type: llm-judge
      weight: 0.4
      config:
        criteria:
          - completeness
          - technical_accuracy
          - clarity
          - production_readiness
          - best_practices

timeout_seconds: 120
tags:
  - scaffold
  - dotnet
  - worker
  - project-structure
