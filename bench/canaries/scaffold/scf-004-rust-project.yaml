# Canary: Rust axum API Project Scaffolding
id: scf-004-rust-project
version: "1.0"
phase: scaffold
title: "Rust axum API Project Scaffolding"
description: >
  Tests the AI agent's ability to scaffold a production-ready Rust API
  project with the harness rust profile structure, Cargo, layered
  modules, entry points, and development tooling.

prompt: |
  You are a senior Rust engineer. Scaffold a production-ready Rust API
  project for a user management microservice with the following
  specifications:

  Project Requirements:
  - Service name: user-management-api
  - Rust 1.99, edition 2024, with Cargo (Cargo.toml pins rust-version)
  - axum web framework on tokio, serde for request/response bodies
  - Trait-first services shared as Arc<dyn Trait>

  Expected Project Structure:
  1. Cargo.toml with package user-management-api and a library crate
  2. Layered modules in one crate: web, service, model — dependency
     direction web -> service -> model
  3. Configuration from environment variables (PORT, default 8080)
  4. Health check and readiness endpoints (/health, /health/ready)
  5. A thin composition-root main.rs that wires the implementations;
     lib.rs declares modules only
  6. Dockerfile with multi-stage build (rust build stage + distroless
     cc runtime, non-root)
  7. cargo fmt and cargo clippy (-D warnings) clean
  8. Integration tests under tests/ with tower oneshot for the
     handlers, plus an architecture test that enforces the module
     dependency direction
  9. A GitHub Actions CI workflow that runs cargo fmt --check,
     cargo clippy, cargo test, and docker build

  For each file generated, include appropriate comments explaining the
  purpose. Ensure all imports are valid and the project builds with
  `cargo build` and tests with `cargo test` out of the box.

expected:
  keywords:
    - Cargo.toml
    - Dockerfile
    - axum
    - tokio
    - serde
    - clippy
  graders:
    - type: keyword
      weight: 0.3
      config:
        required:
          - Cargo.toml
          - Dockerfile
          - axum
          - tokio
          - serde
          - clippy
          - rustfmt
          - distroless
          - oneshot
        forbidden: ["TODO", "placeholder"]
    - type: structural
      weight: 0.3
      config:
        required_sections:
          - project structure
          - configuration
          - entry point
          - testing
          - containerization
    - type: llm-judge
      weight: 0.4
      config:
        criteria:
          - completeness
          - technical_accuracy
          - clarity
          - production_readiness
          - best_practices

timeout_seconds: 120
tags:
  - scaffold
  - rust
  - axum
  - project-structure
