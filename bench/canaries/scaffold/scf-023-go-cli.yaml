# Canary: Go CLI Scaffolding
id: scf-023-go-cli
version: "1.0"
phase: scaffold
title: "Go CLI Scaffolding"
description: >
  Tests the AI agent's ability to scaffold a command-line tool
  with the harness go profile structure: Cobra as the parser,
  the noun-verb command shape, the stdout/stderr and exit-code
  contract, golden-file tests, and GoReleaser distribution.

prompt: |
  You are a senior Go engineer. Scaffold a command-line tool
  ("textkit": text utilities such as slugify and truncate) with
  the following specifications:

  Project Requirements:
  - Go modules with Cobra as the argument parser; the project
    lives in `src/<Name>CLI`, with the entry point under
    cmd/<project-name>
  - The interface is the contract: commands follow
    `tool <noun> <verb>`, data goes to stdout and diagnostics to
    stderr, and exit codes are a documented map (0 success,
    1 runtime failure, 2 usage error)

  Expected Project Structure:
  1. go.mod with Cobra; the command tree and logic under
     internal/cli (main.go only wires and executes)
  2. Man page generation wired from the Cobra command tree
  3. A `--format plain|json` option on data commands; secrets
     come from the environment, never from command-line flags
  4. Tests: golden-file tests for help text and command output
     (plain and JSON), plus exit-code contract tests for the
     success, runtime-failure, and usage-error paths
  5. Distribution: GoReleaser (.goreleaser.yaml) builds the
     release binaries on tag — the same tag-driven shape as the
     other stacks
  6. No Dockerfile — a CLI ships as binaries, not a container
  7. A GitHub Actions CI workflow that runs go vet, golangci-lint,
     and `go test ./...`

  For each file generated, include appropriate comments explaining
  the purpose. Ensure `go test ./...` passes out of the box.

expected:
  keywords:
    - Cobra
    - go.mod
    - golden
    - exit code
    - stdout
    - GoReleaser
  graders:
    - type: keyword
      weight: 0.3
      config:
        required:
          - Cobra
          - go.mod
          - golden
          - exit code
          - stdout
          - stderr
          - GoReleaser
        forbidden: ["TODO", "placeholder"]
    - type: structural
      weight: 0.3
      config:
        required_sections:
          - project structure
          - commands
          - configuration
          - testing
          - distribution
    - type: llm-judge
      weight: 0.4
      config:
        criteria:
          - completeness
          - technical_accuracy
          - clarity
          - production_readiness
          - best_practices

timeout_seconds: 120
tags:
  - scaffold
  - go
  - cli
  - project-structure
