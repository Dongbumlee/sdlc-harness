# Canary: Go HTTP API Project Scaffolding
id: scf-003-go-project
version: "1.0"
phase: scaffold
title: "Go HTTP API Project Scaffolding"
description: >
  Tests the AI agent's ability to scaffold a production-ready Go API
  project with the harness go profile structure, Go modules, layered
  internal packages, entry points, and development tooling.

prompt: |
  You are a senior Go engineer. Scaffold a production-ready Go API
  project for a user management microservice with the following
  specifications:

  Project Requirements:
  - Service name: user-management-api
  - Go 1.27 with Go modules (go.mod pins the language version)
  - Standard library net/http with http.ServeMux method-and-pattern
    routing — no web framework unless the organization declares one
  - encoding/json for request and response bodies

  Expected Project Structure:
  1. go.mod with module example.com/user-management-api
  2. Layered packages under internal/: web, service, model —
     dependency direction web -> service -> model
  3. Configuration from environment variables (PORT, default 8080)
  4. Health check and readiness endpoints (/health, /health/ready)
  5. A composition-root main under cmd/user-management-api that wires
     the implementations (constructors only, no DI container)
  6. Dockerfile with multi-stage build (golang build stage +
     distroless static runtime, non-root)
  7. gofmt and go vet clean
  8. Go tests with httptest for the handlers, plus an architecture
     test that enforces the package dependency direction
  9. A GitHub Actions CI workflow that runs gofmt check, go vet,
     go test, and docker build

  For each file generated, include appropriate comments explaining the
  purpose. Ensure all imports are valid and the project builds with
  `go build ./...` and tests with `go test ./...` out of the box.

expected:
  keywords:
    - go.mod
    - Dockerfile
    - Go modules
    - net/http
    - ServeMux
    - httptest
  graders:
    - type: keyword
      weight: 0.3
      config:
        required:
          - go.mod
          - Dockerfile
          - Go modules
          - net/http
          - ServeMux
          - httptest
          - gofmt
          - go vet
          - distroless
        forbidden: ["TODO", "placeholder"]
    - type: structural
      weight: 0.3
      config:
        required_sections:
          - project structure
          - configuration
          - entry point
          - testing
          - containerization
    - type: llm-judge
      weight: 0.4
      config:
        criteria:
          - completeness
          - technical_accuracy
          - clarity
          - production_readiness
          - best_practices

timeout_seconds: 120
tags:
  - scaffold
  - go
  - net-http
  - project-structure
