# Canary: FastAPI Project Scaffolding
id: scf-001-fastapi-project
version: "1.1"
phase: scaffold
title: "FastAPI Project Scaffolding"
description: >
  Tests the AI agent's ability to scaffold a production-ready FastAPI
  project with the harness python profile structure, uv-managed
  packaging, layered app modules, a composition-root entry point, and
  development tooling. (Aligned to the python profile in v1.1, like
  scf-002/003/004 for their stacks; v1.0 tested a freehand scaffold.)

prompt: |
  You are a senior Python engineer. Scaffold a production-ready FastAPI
  project for a user management microservice with the following
  specifications:

  Project Requirements:
  - Service name: user-management-api
  - Python 3.12+ with uv as the package manager
  - FastAPI with pydantic v2 models and pydantic-settings configuration
  - Persistence behind a repository interface — the scaffold ships an
    in-memory implementation; a real store drops in behind the interface

  Expected Project Structure:
  1. pyproject.toml (uv project) with ruff as the pinned formatter
     and linter — there is no second formatter
  2. Layered app package: routers, services (interfaces /
     implementations / models / errors), libs (application, base) —
     routers depend on service interfaces, never on implementations
  3. Configuration via a pydantic-settings Configuration class
     populated from environment / .env, with .env.example documenting
     the keys
  4. Health check and readiness endpoints (/health, /health/ready)
  5. A composition-root Application class that wires services into an
     application context; main.py exposes the app through it — never
     a bare FastAPI()
  6. Dockerfile on the Azure Linux Python base image: uv copied from
     the official uv image, `uv sync --frozen`, non-root user,
     uvicorn entry point
  7. Domain errors raised by services and mapped to HTTP status codes
     in one place in the composition root
  8. pytest tests with async support: health and items tests, plus an
     architecture test that enforces the layer dependency direction
  9. A GitHub Actions CI workflow that runs uv sync --frozen,
     ruff check, ruff format --check, pytest --cov, and a docker build

  For each file generated, include appropriate comments explaining the
  purpose. Ensure all imports are valid and the project passes
  `uv run pytest` out of the box.

expected:
  keywords:
    - pyproject.toml
    - Dockerfile
    - FastAPI
    - uvicorn
    - pydantic
    - pytest
    - ruff
  graders:
    - type: keyword
      weight: 0.3
      config:
        required:
          - pyproject.toml
          - Dockerfile
          - FastAPI
          - uvicorn
          - pydantic
          - pytest
          - ruff
          - repository
          - health
        forbidden: ["TODO", "placeholder"]
    - type: structural
      weight: 0.3
      config:
        required_sections:
          - project structure
          - configuration
          - entry point
          - testing
          - containerization
    - type: llm-judge
      weight: 0.4
      config:
        criteria:
          - completeness
          - technical_accuracy
          - clarity
          - production_readiness
          - best_practices

timeout_seconds: 120
tags:
  - scaffold
  - fastapi
  - python
  - project-structure
