# Canary: .NET Library Scaffolding
id: scf-006-dotnet-library
version: "1.0"
phase: scaffold
title: ".NET Library Scaffolding"
description: >
  Tests the AI agent's ability to scaffold a publishable .NET
  library with the harness dotnet profile structure: a tracked
  public API surface, black-box tests, and package hygiene (no
  committed lock file, ranged package references).

prompt: |
  You are a senior .NET engineer. Scaffold a publishable .NET
  library for text manipulation utilities ("textkit") with the
  following specifications:

  Project Requirements:
  - .NET 10 class library, solution layout with the library and
    its test project under `src/`
  - The library is a product other teams consume: its public
    surface is explicit and machine-checked
  - Package references declare version ranges — no exact pins,
    and no committed lock file (a library does not impose one on
    its consumers)

  Expected Project Structure:
  1. A solution (.sln) with `src/<Name>` and `src/<Name>.Tests`
  2. The public API surface tracked in PublicAPI.Shipped.txt and
     PublicAPI.Unshipped.txt, enforced by the public-API analyzer
  3. A small sample API (text transforms: slugify, truncate) with
     XML documentation on every public member
  4. Shared build settings in Directory.Build.props at the repo
     root (nullable, warnings-as-errors posture, package metadata)
  5. Tests: behavior tests against the public surface only
     (black-box), plus a public-surface test that fails when the
     tracked surface and the compiled surface drift
  6. Packaging: the project packs as a NuGet package with version,
     description, and license metadata; a release workflow packs
     and publishes on tag
  7. No Dockerfile — a library is consumed as a package, never
     deployed as a container
  8. A GitHub Actions CI workflow that restores, builds, and tests
     the solution

  For each file generated, include appropriate comments explaining
  the purpose. Ensure `dotnet test` passes out of the box.

expected:
  keywords:
    - PublicAPI.Shipped.txt
    - NuGet
    - Directory.Build.props
    - dotnet test
    - public surface
  graders:
    - type: keyword
      weight: 0.3
      config:
        required:
          - PublicAPI.Shipped.txt
          - NuGet
          - Directory.Build.props
          - dotnet test
          - public surface
          - black-box
        forbidden: ["TODO", "placeholder"]
    - type: structural
      weight: 0.3
      config:
        required_sections:
          - project structure
          - public surface
          - testing
          - packaging
    - type: llm-judge
      weight: 0.4
      config:
        criteria:
          - completeness
          - technical_accuracy
          - clarity
          - production_readiness
          - best_practices

timeout_seconds: 120
tags:
  - scaffold
  - dotnet
  - library
  - project-structure
