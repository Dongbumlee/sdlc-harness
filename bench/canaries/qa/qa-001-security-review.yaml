# Canary: Security Review of API Code
id: qa-001-security-review
version: "1.1"
phase: qa
title: "Security Review of API Code"
description: >
  Tests the AI agent's ability to identify security vulnerabilities in a
  Flask API code sample and produce actionable remediation recommendations.

prompt: |
  You are a senior security engineer. Perform a thorough security review of
  the following Flask API code and identify all vulnerabilities:

  ```python
  1   from flask import Flask, request, jsonify
  2   import sqlite3
  3   import os
  4
  5   app = Flask(__name__)
  6   SECRET_KEY = "CHANGEME-INSECURE-TEST-FIXTURE"  # intentionally hardcoded: reviewers must flag this
  7
  8   @app.route("/login", methods=["POST"])
  9   def login():
  10      username = request.form["username"]
  11      password = request.form["password"]
  12      conn = sqlite3.connect("users.db")
  13      cursor = conn.execute(
  14          f"SELECT * FROM users WHERE username='{username}' AND password='{password}'"
  15      )
  16      user = cursor.fetchone()
  17      if user:
  18          return jsonify({"token": SECRET_KEY + username})
  19      return jsonify({"error": "Invalid credentials"}), 401
  20
  21  @app.route("/exec", methods=["POST"])
  22  def run_command():
  23      cmd = request.json["command"]
  24      result = os.popen(cmd).read()
  25      return jsonify({"output": result})
  ```

  Deliverables:
  1. Vulnerability report listing each issue with:
     - Vulnerability type (e.g., SQL Injection, Command Injection)
     - Severity (Critical / High / Medium / Low) using this scale exactly:
       - Critical: exploitable vulnerability; must be fixed before merge
       - High: significant risk; fix in the same sprint
       - Medium: weakness or missing defense-in-depth control; plan remediation
       - Low: hardening suggestion; future iteration
     - Affected line(s) of code (use the line numbers shown above)
     - Explanation of the risk
  2. Remediation plan with corrected code for each vulnerability
  3. Security best practices checklist for this type of API

expected:
  keywords:
    - SQL injection
    - hardcoded secret
    - command injection
    - input validation
  graders:
    - type: keyword
      weight: 0.3
      config:
        required:
          - SQL injection
          - hardcoded secret
          - command injection
          - input validation
          - parameterized
          - remediation
          - severity
          - authentication
          - checklist
        forbidden: ["TODO", "placeholder"]
    - type: structural
      weight: 0.3
      config:
        required_sections:
          - vulnerability report
          - SQL injection
          - command injection
          - hardcoded
          - remediation
          - best practices checklist
    - type: llm-judge
      weight: 0.4
      config:
        criteria:
          - completeness
          - technical_accuracy
          - severity_assessment
          - remediation_quality
          - actionability

timeout_seconds: 120
tags:
  - qa
  - security
  - code-review
  - vulnerability
