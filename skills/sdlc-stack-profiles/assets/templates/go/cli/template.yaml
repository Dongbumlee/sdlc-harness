# Bundled default template — go / cli
# Instantiation: copy this tree to the repository root, substitute the
# tokens below in file names and contents, delete template.yaml, then run
# the verify steps. The CLI follows the cli standard in the
# sdlc-stack-profiles skill ("CLI type — the interface is the
# contract"): cobra parsing, data to stdout and diagnostics to stderr,
# a documented exit-code map, golden-file and exit-code tests, and
# GoReleaser-shaped tag releases. go.sum is generated by the install
# step (go mod tidy — a dependency-bearing module needs it to write
# the sum file), never templated.
id: go/cli
profile: go
kind: cli
project_dirs:
  - src/{{ProjectName}}CLI
tokens:
  - name: ProjectName
    description: PascalCase base name of the product or service, e.g. TaskTracker
    default: Sample
  - name: project-name
    description: kebab-case name derived from ProjectName, e.g. task-tracker — used for the module path, the binary name, and the command name
    default: sample
  - name: Year
    description: Four-digit year written into the LICENSE copyright line at instantiation (use the current year)
    default: 2026
verify:
  - step: install
    cwd: src/{{ProjectName}}CLI
    command: go mod tidy
  - step: build
    cwd: src/{{ProjectName}}CLI
    command: go build ./...
  - step: test
    cwd: src/{{ProjectName}}CLI
    command: go test ./...
