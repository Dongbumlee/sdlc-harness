# GoReleaser configuration — the release is driven by the git tag and
# produces the full artefact matrix: cross-compiled binaries for
# linux/darwin/windows on amd64/arm64, archives, a SHA-256 checksums
# file, deb/rpm packages, and a Homebrew formula. The version is
# injected from the tag; an untagged (snapshot) build reports "dev".
# Release notes come from CHANGELOG.md (the workflow extracts the
# tag's section and passes it in); GoReleaser's own changelog is off.
version: 2

project_name: {{project-name}}

builds:
  - id: {{project-name}}
    dir: src/{{ProjectName}}CLI
    main: ./cmd/{{project-name}}
    binary: {{project-name}}
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{ .Version }}

archives:
  - id: default
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}

checksum:
  name_template: checksums.txt
  algorithm: sha256

snapshot:
  version_template: "{{ incpatch .Version }}-dev"

changelog:
  disable: true

nfpms:
  - id: packages
    package_name: {{project-name}}
    maintainer: Your Name <you@example.com>
    description: "{{ProjectName}} sample command-line tool."
    license: MIT
    formats:
      - deb
      - rpm
    ids:
      - {{project-name}}

# Homebrew tap (as a cask — the current GoReleaser/Homebrew way to
# ship prebuilt binaries): create the tap repository and a
# HOMEBREW_TAP_TOKEN secret (a token with write access to it), then
# remove skip_upload.
homebrew_casks:
  - name: {{project-name}}
    repository:
      owner: example
      name: homebrew-{{project-name}}
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    skip_upload: true
    homepage: https://example.com/{{project-name}}
    description: "{{ProjectName}} sample command-line tool."
    license: MIT
    binaries:
      - {{project-name}}

release:
  draft: false
  prerelease: auto
  # Generated by the release workflow from the command tree itself.
  extra_files:
    - glob: ./man/*
    - glob: ./completions/*
