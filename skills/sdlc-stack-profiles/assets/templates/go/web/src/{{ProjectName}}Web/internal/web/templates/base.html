<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{block "title" .}}{{.Public.AppName}}{{ end }}</title>
    <link rel="stylesheet" href="/static/site.css" />
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to main content</a>
    <header>
      <p class="app-name">{{.Public.AppName}}</p>
      <nav aria-label="Primary">
        <ul>
          <li><a href="/">Items</a></li>
          <li><a href="/health">Health</a></li>
        </ul>
      </nav>
    </header>
    <main id="main">
      {{block "content" .}}{{ end }}
    </main>
    <footer>
      <p>{{.Public.AppName}} — server-rendered sample.</p>
    </footer>
  </body>
</html>
