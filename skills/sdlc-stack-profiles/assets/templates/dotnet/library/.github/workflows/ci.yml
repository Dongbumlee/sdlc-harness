name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Restore
        run: dotnet restore {{ProjectName}}.sln
      - name: Verify format
        run: dotnet format {{ProjectName}}.sln --verify-no-changes --no-restore
      - name: Build
        run: dotnet build {{ProjectName}}.sln -c Release --no-restore
      - name: Test
        run: dotnet test {{ProjectName}}.sln -c Release --no-build

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Restore (generate the lock files the scan audits)
        # The repository deliberately commits no lock file (see
        # Directory.Build.props); generate them here so the
        # dependency scan has a resolved set to audit.
        run: dotnet restore {{ProjectName}}.sln -p:RestorePackagesWithLockFile=true
      - name: Secret scan (gitleaks)
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar -xz --no-same-owner -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --redact .
      - name: Dependency scan (OSV-Scanner)
        run: |
          curl -sSfL -o "$RUNNER_TEMP/osv-scanner" https://github.com/google/osv-scanner/releases/download/v2.7.1/osv-scanner_linux_amd64
          chmod +x "$RUNNER_TEMP/osv-scanner"
          "$RUNNER_TEMP/osv-scanner" scan --recursive ./
