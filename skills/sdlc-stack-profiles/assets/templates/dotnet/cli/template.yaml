# Bundled default template — dotnet / cli
# Instantiation: copy this tree to the repository root, substitute the
# tokens below in file names and contents, delete template.yaml, then run
# the verify steps. The CLI follows the cli standard in the
# sdlc-stack-profiles skill ("CLI type — the interface is the
# contract"): System.CommandLine parsing, data to stdout and
# diagnostics to stderr, a documented exit-code map, golden-file and
# exit-code tests, and single-file publish + NuGet tool tag releases in
# the same artefact shape as every other stack. Lock files are
# generated by the install step, never templated.
id: dotnet/cli
profile: dotnet
kind: cli
project_dirs:
  - src/{{ProjectName}}.Cli
  - src/{{ProjectName}}.Cli.Core
  - src/{{ProjectName}}.Cli.Tests
tokens:
  - name: ProjectName
    description: PascalCase base name of the product, e.g. TaskTracker
    default: Sample
  - name: project-name
    description: kebab-case name derived from ProjectName, e.g. task-tracker — used for the command and package names
    default: sample
  - name: Year
    description: Four-digit year written into the LICENSE copyright line at instantiation (use the current year)
    default: 2026
verify:
  - step: install
    cwd: .
    command: dotnet restore {{ProjectName}}.sln
  - step: build
    cwd: .
    command: dotnet build {{ProjectName}}.sln -c Release
  - step: test
    cwd: .
    command: dotnet test {{ProjectName}}.sln -c Release
