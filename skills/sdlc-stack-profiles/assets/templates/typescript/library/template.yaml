# Bundled default template — typescript / library
# Instantiation: copy this tree to the repository root, substitute the
# tokens below in file names and contents, delete template.yaml, then run
# the verify steps. Lock files are generated by the install step, never
# templated — and never committed: a library declares version ranges,
# it does not impose a lock file on its consumers. See the
# sdlc-stack-profiles skill ("Bundled default templates").
id: typescript/library
profile: typescript
kind: library
project_dirs:
  - src
tokens:
  - name: ProjectName
    description: PascalCase base name of the product, e.g. TextKit
    default: Sample
  - name: project-name
    description: kebab-case distribution (npm package) name derived from ProjectName, e.g. text-kit
    default: sample
  - name: Year
    description: Four-digit year written into the LICENSE copyright line at instantiation (use the current year)
    default: 2026
verify:
  - step: install
    cwd: .
    command: pnpm install --no-frozen-lockfile
  - step: build
    cwd: .
    command: pnpm build
  - step: test
    cwd: .
    command: pnpm test
