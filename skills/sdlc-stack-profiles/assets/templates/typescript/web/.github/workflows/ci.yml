name: CI

on:
  push:
    branches: [main]
    paths:
      - "src/{{ProjectName}}Web/**"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "src/{{ProjectName}}Web/**"
      - ".github/workflows/ci.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/{{ProjectName}}Web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: src/{{ProjectName}}Web/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Test
        run: pnpm test
      - name: Build
        run: pnpm build
      - name: Build Docker image
        run: docker build -t {{project-name}}-web .

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy (organization step)
        run: echo "Deploy {{ProjectName}}Web here — wire the organization's deployment action (see the sdlc deployment skills)."
