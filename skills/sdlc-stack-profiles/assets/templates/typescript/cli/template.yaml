# Bundled default template — typescript / cli
# Instantiation: copy this tree to the repository root, substitute the
# tokens below in file names and contents, delete template.yaml, then run
# the verify steps. The CLI follows the cli standard in the
# sdlc-stack-profiles skill ("CLI type — the interface is the
# contract"): Commander parsing, data to stdout and diagnostics to
# stderr, a documented exit-code map, golden-file and exit-code tests,
# and Node SEA binaries + an npm package in the same artefact shape as
# every other stack. Lock files are generated by the install step,
# never templated.
id: typescript/cli
profile: typescript
kind: cli
project_dirs:
  - src
tokens:
  - name: ProjectName
    description: PascalCase base name of the product, e.g. TaskTracker
    default: Sample
  - name: project-name
    description: kebab-case name derived from ProjectName, e.g. task-tracker — used for the package and command names
    default: sample
  - name: Year
    description: Four-digit year written into the LICENSE copyright line at instantiation (use the current year)
    default: 2026
verify:
  - step: install
    cwd: .
    command: pnpm install --no-frozen-lockfile
  - step: build
    cwd: .
    command: pnpm build
  - step: test
    cwd: .
    command: pnpm test
