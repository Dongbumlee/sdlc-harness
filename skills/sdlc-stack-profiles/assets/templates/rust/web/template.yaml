# Bundled default template — rust / web
# Instantiation: copy this tree to the repository root, substitute the
# tokens below in file names and contents, delete template.yaml, then run
# the verify steps. The web app follows the web standard in the
# sdlc-stack-profiles skill ("Web type — the browser is untrusted"):
# server-rendered pages, environment configuration split structurally
# into browser-safe public values and server-only secrets, and the
# WCAG 2.2 AA markup floor.
id: rust/web
profile: rust
kind: web
project_dirs:
  - src/{{ProjectName}}Web
tokens:
  - name: ProjectName
    description: PascalCase base name of the product, e.g. TaskTracker
    default: Sample
  - name: project-name
    description: kebab-case name derived from ProjectName, e.g. task-tracker — used for the package and binary names
    default: sample
  - name: CrateName
    description: snake_case library crate name derived from ProjectName, e.g. task_tracker
    default: sample
  - name: Year
    description: Four-digit year written into the LICENSE copyright line at instantiation (use the current year)
    default: 2026
verify:
  - step: install
    cwd: src/{{ProjectName}}Web
    command: cargo fetch
  - step: build
    cwd: src/{{ProjectName}}Web
    command: cargo build
  - step: test
    cwd: src/{{ProjectName}}Web
    command: cargo test
