name: CI

on:
  push:
    branches: [main]
    paths:
      - "src/{{ProjectName}}CLI/**"
      - "dist-workspace.toml"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "src/{{ProjectName}}CLI/**"
      - "dist-workspace.toml"
      - ".github/workflows/ci.yml"

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/{{ProjectName}}CLI
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --check
      - name: Clippy (warnings are errors)
        run: cargo clippy --all-targets -- -D warnings

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # The declared support range: MSRV floor (rust-version in
        # Cargo.toml) through current stable.
        toolchain: ["1.85", "stable"]
    defaults:
      run:
        working-directory: src/{{ProjectName}}CLI
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
      - name: Test (golden outputs + exit codes pin the CLI contract)
        run: cargo test

  dist-plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate the cargo-dist configuration and plan
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf https://github.com/axodotdev/cargo-dist/releases/download/v0.34.0/cargo-dist-installer.sh | sh
          dist plan --output-format=json > /dev/null

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Secret scan (gitleaks)
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar -xz --no-same-owner -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --redact .
      - name: Dependency scan (OSV-Scanner)
        working-directory: src/{{ProjectName}}CLI
        run: |
          curl -sSfL -o "$RUNNER_TEMP/osv-scanner" https://github.com/google/osv-scanner/releases/download/v2.7.1/osv-scanner_linux_amd64
          chmod +x "$RUNNER_TEMP/osv-scanner"
          # Cargo.lock is generated transiently for the scan (it is not
          # committed for this type). --no-ignore is required: OSV-Scanner
          # otherwise respects .gitignore and silently scans nothing.
          cargo generate-lockfile
          "$RUNNER_TEMP/osv-scanner" scan --lockfile Cargo.lock --no-ignore
