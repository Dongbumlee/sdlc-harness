[package]
name = "{{project-name}}"
version = "0.1.0"
edition = "2024"
# Support floor (MSRV): the oldest toolchain this tool promises to
# build on. CI tests this version and current stable.
rust-version = "1.85"
license = "MIT"
description = "{{ProjectName}} sample command-line tool"
homepage = "https://github.com/example/{{project-name}}"
repository = "https://github.com/example/{{project-name}}"

[lib]
name = "{{CrateName}}"
path = "src/lib.rs"

[[bin]]
name = "{{project-name}}"
path = "src/main.rs"

# Dependencies are declared in caret ranges by policy; the resolved
# Cargo.lock is a build artefact, generated by the install step and
# never committed for this type — releases pin their exact graph in
# the tag's CI run.
[dependencies]
clap = { version = "4.6", features = ["derive"] }
clap_complete = "4.6"
clap_mangen = "0.3"
serde_json = "1.0"

# The release profile cargo-dist builds with (set by `dist init`).
[profile.dist]
inherits = "release"
lto = "thin"
