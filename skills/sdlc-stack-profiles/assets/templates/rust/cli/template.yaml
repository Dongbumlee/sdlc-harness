# Bundled default template — rust / cli
# Instantiation: copy this tree to the repository root, substitute the
# tokens below in file names and contents, delete template.yaml, then run
# the verify steps. The CLI follows the cli standard in the
# sdlc-stack-profiles skill ("CLI type — the interface is the
# contract"): clap parsing, data to stdout and diagnostics to stderr, a
# documented exit-code map, golden-file and exit-code tests, and
# cargo-dist tag releases in the same artefact shape as every other
# stack. Cargo.lock is generated by the install step, never templated.
id: rust/cli
profile: rust
kind: cli
project_dirs:
  - src/{{ProjectName}}CLI
tokens:
  - name: ProjectName
    description: PascalCase base name of the product or service, e.g. TaskTracker
    default: Sample
  - name: project-name
    description: kebab-case name derived from ProjectName, e.g. task-tracker — used for the package and binary names
    default: sample
  - name: CrateName
    description: snake_case crate name derived from ProjectName, e.g. task_tracker — the library target name
    default: sample
  - name: Year
    description: Four-digit year written into the LICENSE copyright line at instantiation (use the current year)
    default: 2026
verify:
  - step: install
    cwd: src/{{ProjectName}}CLI
    command: cargo fetch
  - step: build
    cwd: src/{{ProjectName}}CLI
    command: cargo build
  - step: test
    cwd: src/{{ProjectName}}CLI
    command: cargo test
