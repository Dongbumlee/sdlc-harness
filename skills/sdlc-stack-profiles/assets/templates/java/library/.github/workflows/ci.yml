name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

defaults:
  run:
    working-directory: src/{{ProjectName}}Lib

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The declared support range: every supported JDK line is
        # exercised, not just the newest.
        java: [21, 25]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - name: Verify (compile, test, format check, package)
        run: ./mvnw -B verify
      - name: Run the documented quickstart against the built classes
        if: matrix.java == 21
        run: |
          mkdir -p /tmp/quickstart
          javac -cp target/classes -d /tmp/quickstart examples/Quickstart.java
          java -cp target/classes:/tmp/quickstart Quickstart

  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # japicmp compares against the last release tag
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: API compatibility against the last release (japicmp)
        run: |
          tag="$(git describe --tags --abbrev=0 2>/dev/null || true)"
          if [ -z "$tag" ]; then
            echo "No release tag yet — nothing to compare against."
            exit 0
          fi
          ./mvnw -B -q package -DskipTests
          new_jar="$(ls target/{{project-name}}-*.jar | grep -v -e sources -e javadoc | head -1)"
          git worktree add --detach /tmp/baseline "$tag"
          (cd /tmp/baseline/src/{{ProjectName}}Lib && ./mvnw -B -q package -DskipTests)
          old_jar="$(ls /tmp/baseline/src/{{ProjectName}}Lib/target/{{project-name}}-*.jar | grep -v -e sources -e javadoc | head -1)"
          curl -sSfL -o /tmp/japicmp.jar https://repo1.maven.org/maven2/com/github/siom79/japicmp/japicmp/0.23.1/japicmp-0.23.1-jar-with-dependencies.jar
          java -jar /tmp/japicmp.jar \
            --old "$old_jar" --new "$new_jar" \
            --only-incompatible \
            --error-on-binary-incompatibility \
            --error-on-source-incompatibility

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # gitleaks scans history
      - name: Install secrets scanner (gitleaks, pinned)
        working-directory: .
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar -xz -C /tmp gitleaks
          sudo install /tmp/gitleaks /usr/local/bin/gitleaks
      - name: Scan for secrets
        working-directory: .
        run: gitleaks git --redact .
      - name: Install vulnerability scanner (OSV-Scanner, pinned)
        working-directory: .
        run: |
          curl -sSfL -o /tmp/osv-scanner https://github.com/google/osv-scanner/releases/download/v2.7.1/osv-scanner_linux_amd64
          sudo install /tmp/osv-scanner /usr/local/bin/osv-scanner
      - name: Scan dependencies for known vulnerabilities
        run: osv-scanner scan --recursive --no-ignore .
