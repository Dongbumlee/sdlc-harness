name: Release

# Tag-driven: the tag must match the pom version and have a
# CHANGELOG section. Artefacts are the CLI shape shared by every
# stack: per-platform artefacts (jpackage app-image archives with a
# bundled runtime), a SHA-256 checksums file, generated man pages
# and completions, plus the language channel (Maven Central).

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.check.outputs.version }}
    defaults:
      run:
        working-directory: src/{{ProjectName}}CLI
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches pom and CHANGELOG section exists
        id: check
        working-directory: .
        run: |
          VERSION=$(grep -m1 '<version>' "src/{{ProjectName}}CLI/pom.xml" | sed -E 's/.*<version>([^<]+)<\/version>.*/\1/')
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match pom version $VERSION"
            exit 1
          fi
          grep -q "^## \[$VERSION\]" CHANGELOG.md || {
            echo "::error::No CHANGELOG.md section for version $VERSION"
            exit 1
          }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Test
        run: ./mvnw -B test

  images:
    needs: gate
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            label: linux-x64
          - os: ubuntu-24.04-arm
            label: linux-arm64
          - os: macos-13
            label: darwin-x64
          - os: macos-latest
            label: darwin-arm64
          - os: windows-latest
            label: windows-x64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: src/{{ProjectName}}CLI
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build the shaded jar and the jpackage app image
        shell: bash
        run: |
          ./mvnw -B package -DskipTests
          mkdir -p dist-input && cp "target/{{project-name}}-${{ needs.gate.outputs.version }}.jar" dist-input/
          jpackage --type app-image --name "{{project-name}}" \
            --input dist-input --main-jar "{{project-name}}-${{ needs.gate.outputs.version }}.jar" \
            --app-version "${{ needs.gate.outputs.version }}" --dest app-image
          tar -czf "{{project-name}}-${{ needs.gate.outputs.version }}-${{ matrix.label }}.tar.gz" -C app-image .
          "./app-image/{{project-name}}/bin/{{project-name}}" --version || "./app-image/{{project-name}}/{{project-name}}.app/Contents/MacOS/{{project-name}}" --version || true
      - uses: actions/upload-artifact@v4
        with:
          name: img-${{ matrix.label }}
          path: "src/{{ProjectName}}CLI/{{project-name}}-${{ needs.gate.outputs.version }}-${{ matrix.label }}.tar.gz"

  publish:
    needs: [gate, images]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: src/{{ProjectName}}CLI
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - uses: actions/download-artifact@v4
        with:
          path: release
          pattern: img-*
          merge-multiple: true
      - name: Jar, man page, and completions from the shaded jar
        working-directory: .
        run: |
          sudo apt-get update && sudo apt-get install -y help2man
          cd src/{{ProjectName}}CLI && ./mvnw -B package -DskipTests && cd ../..
          JAR="src/{{ProjectName}}CLI/target/{{project-name}}-${{ needs.gate.outputs.version }}.jar"
          cp "$JAR" release/
          mkdir -p release/man release/completions
          help2man --no-info --name "{{ProjectName}} sample command-line tool" -o release/man/{{project-name}}.1 "java -jar $JAR"
          for shell in bash zsh; do
            java -jar "$JAR" completions "$shell" > "release/completions/{{project-name}}.$shell"
          done
      - name: Checksums
        working-directory: release
        run: sha256sum {{project-name}}-* > checksums.txt
      - name: Extract release notes from CHANGELOG.md
        working-directory: .
        run: |
          VERSION="${{ needs.gate.outputs.version }}"
          awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" { found=1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
      - name: Create the GitHub Release
        working-directory: .
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/* \
            --title "$GITHUB_REF_NAME" --notes-file release-notes.md

  maven-central:
    needs: gate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/{{ProjectName}}CLI
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          server-id: central
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE
      - name: Deploy to Maven Central
        # Maven Central has no OIDC trusted publishing (the one
        # documented channel exception): a token + GPG signing.
        run: ./mvnw -B deploy -DskipTests
        env:
          MAVEN_USERNAME: ${{ secrets.CENTRAL_TOKEN_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.CENTRAL_TOKEN_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
