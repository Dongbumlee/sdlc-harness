name: CI

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "src/**"
      - ".github/workflows/ci.yml"

permissions:
  contents: read

defaults:
  run:
    working-directory: src/{{ProjectName}}CLI

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build
        run: ./mvnw -B package -DskipTests
      - name: Test (golden outputs + exit codes pin the CLI contract)
        run: ./mvnw -B test
      - name: Format check (spotless / googleJavaFormat)
        run: ./mvnw -B spotless:check
      - name: Environment precedence at the packaged-jar level
        run: |
          OUT=$(SAMPLE_FORMAT=json java -jar "target/{{project-name}}-0.1.0.jar" text slugify "Hello World")
          echo "$OUT"
          case "$OUT" in '{"result":"hello-world"}') ;; *) echo "::error::env precedence failed: $OUT"; exit 1;; esac
          OUT2=$(SAMPLE_FORMAT=json java -jar "target/{{project-name}}-0.1.0.jar" --format plain text slugify "Hello World")
          [ "$OUT2" = "hello-world" ] || { echo "::error::flag-over-env precedence failed: $OUT2"; exit 1; }

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Secret scan (gitleaks)
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar -xz --no-same-owner -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --redact .
      - name: Dependency scan (OSV-Scanner)
        run: |
          curl -sSfL -o "$RUNNER_TEMP/osv-scanner" https://github.com/google/osv-scanner/releases/download/v2.7.1/osv-scanner_linux_amd64
          chmod +x "$RUNNER_TEMP/osv-scanner"
          "$RUNNER_TEMP/osv-scanner" scan --recursive ./
