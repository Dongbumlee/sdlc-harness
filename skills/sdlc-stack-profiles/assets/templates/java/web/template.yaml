# Bundled default template — java / web
# Instantiation: copy this tree to the repository root, substitute the
# tokens below in file names and contents, delete template.yaml, then run
# the verify steps. The web app follows the web standard in the
# sdlc-stack-profiles skill ("Web type — the browser is untrusted"):
# server-rendered pages, environment configuration split structurally
# into browser-safe public values and server-only secrets, and the
# WCAG 2.2 AA markup floor.
id: java/web
profile: java
kind: web
project_dirs:
  - src/{{ProjectName}}Web
tokens:
  - name: ProjectName
    description: PascalCase base name of the product, e.g. TaskTracker — used for the application class name
    default: Sample
  - name: project-name
    description: kebab-case name derived from ProjectName, e.g. task-tracker — used for the Maven artifactId
    default: sample
  - name: PackageName
    description: Java package segment derived from ProjectName, lowercase, e.g. tasktracker
    default: sample
  - name: Year
    description: Four-digit year written into the LICENSE copyright line at instantiation (use the current year)
    default: 2026
verify:
  - step: install
    cwd: src/{{ProjectName}}Web
    command: ./mvnw -B -q dependency:resolve
  - step: build
    cwd: src/{{ProjectName}}Web
    command: ./mvnw -B -q package -DskipTests
  - step: test
    cwd: src/{{ProjectName}}Web
    command: ./mvnw -B test
