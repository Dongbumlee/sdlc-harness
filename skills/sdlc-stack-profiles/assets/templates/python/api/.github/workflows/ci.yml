name: CI

on:
  push:
    branches: [main]
    paths:
      - "src/{{ProjectName}}API/**"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "src/{{ProjectName}}API/**"
      - ".github/workflows/ci.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/{{ProjectName}}API
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install dependencies
        run: uv sync --frozen
      - name: Lint (ruff)
        run: uv run ruff check .
      - name: Verify format (ruff)
        run: uv run ruff format --check .
      - name: Test
        run: uv run pytest --cov --junitxml=results.xml
      - name: Build Docker image
        run: docker build -t {{project-name}}-api .

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Secret scan (gitleaks)
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar -xz --no-same-owner -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --redact .
      - name: Dependency scan (OSV-Scanner)
        run: |
          curl -sSfL -o "$RUNNER_TEMP/osv-scanner" https://github.com/google/osv-scanner/releases/download/v2.7.1/osv-scanner_linux_amd64
          chmod +x "$RUNNER_TEMP/osv-scanner"
          "$RUNNER_TEMP/osv-scanner" scan --recursive ./

  deploy:
    needs: [build, security]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy (organization step)
        run: echo "Deploy {{ProjectName}}API here — wire the organization's deployment action (see the sdlc deployment skills)."
