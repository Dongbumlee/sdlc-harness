[project]
name = "{{project-name}}"
version = "0.1.0"
description = "{{ProjectName}} API"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.115.12",
    "uvicorn>=0.34.3",
    "pydantic>=2.11.5",
    "pydantic-settings>=2.9.1",
]

[dependency-groups]
dev = [
    "pytest>=8.4.0",
    "pytest-asyncio>=1.1.0",
    "pytest-cov>=6.2.1",
    "httpx>=0.28.1",
    "ruff>=0.8.0",
]

# Ruff is the pinned formatter + linter for every Python project.
# CI runs `ruff check` and `ruff format --check`; there is no second
# formatter and no per-project rule shopping.
[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# FastAPI's dependency injection is declared as `= Depends(...)` in
# parameter defaults by design; B008's generic rule does not apply
# to router signatures.
"app/routers/*.py" = ["B008"]

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = ["--import-mode=importlib"]

[tool.coverage.run]
source = ["app"]
