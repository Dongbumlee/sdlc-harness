[build-system]
requires = ["uv_build>=0.9.0,<0.10.0"]
build-backend = "uv_build"

[project]
name = "{{project-name}}"
version = "0.1.0"
description = "{{ProjectName}} — a Python library."
readme = "README.md"
requires-python = ">=3.10"
# A library declares abstract ranges for what it can work with; it
# never exact-pins a dependency and never imposes a lock file on its
# consumers. An application records what it did work with — a library
# declares what it can work with. Example:
# dependencies = ["httpx>=0.27,<1.0"]
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.4.0",
    "pytest-cov>=6.2.1",
    "ruff>=0.8.0",
    "griffe>=1.7.0",
]

# Ruff is the pinned formatter + linter for every Python project.
# CI runs `ruff check` and `ruff format --check`; there is no second
# formatter and no per-project rule shopping. The target version is
# the lowest supported Python — lint must reject syntax the oldest
# supported runtime cannot run.
[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

# The package's docstring examples are executable documentation:
# pytest runs them (--doctest-modules) so the quickstart can never
# silently rot.
[tool.pytest.ini_options]
addopts = ["--import-mode=importlib", "--doctest-modules"]
testpaths = ["tests", "src"]

[tool.coverage.run]
source = ["{{project_name}}"]
