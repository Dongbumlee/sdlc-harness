<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 186" width="520" height="186" font-family="'IBM Plex Sans','Segoe UI',Helvetica,Arial,sans-serif" role="img" aria-label="Review findings go back to the builder, the changed parts are checked again, and clean work moves on">
  <rect x="0" y="0" width="520" height="186" fill="#ffffff"/>
      <defs><marker id="a4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d1f"/></marker></defs>
      <g>
        <rect x="30" y="34" width="130" height="48" rx="8" fill="#fff" stroke="#d8d8d2"/>
        <text x="95" y="56" font-size="12" font-weight="700" fill="#1a1a1a" text-anchor="middle">REVIEW</text>
        <text x="95" y="72" font-size="10.5" fill="#555" text-anchor="middle">finds problems</text>
      </g>
      <g>
        <rect x="330" y="34" width="160" height="48" rx="8" fill="#fff" stroke="#d8d8d2"/>
        <text x="410" y="56" font-size="12" font-weight="700" fill="#1a1a1a" text-anchor="middle">BUILDER FIXES</text>
        <text x="410" y="72" font-size="10.5" fill="#555" text-anchor="middle">only what was flagged</text>
      </g>
      <line x1="162" y1="58" x2="326" y2="58" stroke="#8a6d1f" stroke-width="1.5" marker-end="url(#a4)"/>
      <text x="244" y="48" font-size="11" fill="#555" text-anchor="middle">the findings</text>
      <path d="M330,82 L330,112 L150,112 L150,86" fill="none" stroke="#8a6d1f" stroke-width="1.5" marker-end="url(#a4)"/>
      <text x="247" y="128" font-size="11" fill="#555" text-anchor="middle">the changed parts are checked again</text>
      <path d="M60,82 L60,138" stroke="#8a6d1f" stroke-width="1.5" marker-end="url(#a4)"/>
      <text x="70" y="142" font-size="11" fill="#8a6d1f" font-weight="700">no serious findings → the work moves on</text>
      <text x="490" y="168" font-size="11" fill="#555" text-anchor="end">still failing after a few rounds → you decide</text>
    </svg>