<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 176" width="520" height="176" font-family="'IBM Plex Sans','Segoe UI',Helvetica,Arial,sans-serif" role="img" aria-label="Reviewers who did not build the product check it from several angles and reach one verdict">
  <rect x="0" y="0" width="520" height="176" fill="#ffffff"/>
      <defs><marker id="a3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d1f"/></marker></defs>
      <g>
        <rect x="8" y="66" width="96" height="44" rx="8" fill="#fff" stroke="#d8d8d2"/>
        <text x="56" y="85" font-size="11.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">BUILDER</text>
        <text x="56" y="101" font-size="10" fill="#555" text-anchor="middle">builds it</text>
      </g>
      <g>
        <rect x="128" y="66" width="104" height="44" rx="8" fill="#fafaf7" stroke="#d8d8d2"/>
        <text x="180" y="85" font-size="11.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">THE PRODUCT</text>
        <text x="180" y="101" font-size="10" fill="#555" text-anchor="middle">finished work</text>
      </g>
      <g font-size="11">
        <rect x="262" y="10" width="128" height="36" rx="7" fill="#fff" stroke="#d8d8d2"/><text x="326" y="33" fill="#1a1a1a" text-anchor="middle">security</text>
        <rect x="262" y="70" width="128" height="36" rx="7" fill="#fff" stroke="#d8d8d2"/><text x="326" y="93" fill="#1a1a1a" text-anchor="middle">code quality</text>
        <rect x="262" y="130" width="128" height="36" rx="7" fill="#fff" stroke="#d8d8d2"/><text x="326" y="153" fill="#1a1a1a" text-anchor="middle">tests · readiness</text>
      </g>
      <g>
        <rect x="420" y="66" width="92" height="44" rx="8" fill="#fdf3d8" stroke="#c9a227"/>
        <text x="466" y="85" font-size="11.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">VERDICT</text>
        <text x="466" y="101" font-size="10" fill="#555" text-anchor="middle">pass — or stop</text>
