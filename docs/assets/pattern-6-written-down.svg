<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 176" width="520" height="176" font-family="'IBM Plex Sans','Segoe UI',Helvetica,Arial,sans-serif" role="img" aria-label="The run's brief, state and problems live in files, so a new session can pick the run up">
  <rect x="0" y="0" width="520" height="176" fill="#ffffff"/>
      <defs><marker id="a6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d1f"/></marker></defs>
      <g>
        <rect x="8" y="58" width="118" height="52" rx="8" fill="#fff" stroke="#d8d8d2"/>
        <text x="67" y="81" font-size="11.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">A SESSION</text>
        <text x="67" y="97" font-size="10" fill="#555" text-anchor="middle">does the work</text>
        <text x="67" y="128" font-size="10.5" fill="#b3402a" text-anchor="middle">— even if it dies here —</text>
      </g>
      <g font-size="10.5">
        <rect x="196" y="14" width="150" height="34" rx="6" fill="#fafaf7" stroke="#d8d8d2"/><text x="271" y="36" fill="#1a1a1a" text-anchor="middle">the brief</text>
        <rect x="196" y="56" width="150" height="34" rx="6" fill="#fafaf7" stroke="#d8d8d2"/><text x="271" y="78" fill="#1a1a1a" text-anchor="middle">the state of the work</text>
        <rect x="196" y="98" width="150" height="34" rx="6" fill="#fafaf7" stroke="#d8d8d2"/><text x="271" y="120" fill="#1a1a1a" text-anchor="middle">every problem + evidence</text>
        <text x="271" y="152" font-size="11" fill="#555" text-anchor="middle">kept as files, not in a chat</text>
      </g>
      <g>
        <rect x="394" y="58" width="118" height="52" rx="8" fill="#fdf3d8" stroke="#c9a227"/>
        <text x="453" y="81" font-size="11.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">A NEW SESSION</text>
        <text x="453" y="97" font-size="10" fill="#555" text-anchor="middle">picks it up</text>
      </g>
      <g stroke="#8a6d1f" stroke-width="1.5">
        <line x1="128" y1="84" x2="192" y2="84" marker-end="url(#a6)"/>
        <line x1="348" y1="84" x2="390" y2="84" marker-end="url(#a6)"/>
      </g>
    </svg>