<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 176" width="520" height="176" font-family="'IBM Plex Sans','Segoe UI',Helvetica,Arial,sans-serif" role="img" aria-label="Warning signs are tallied as the work goes; when a count trips, the run stops and rethinks">
  <rect x="0" y="0" width="520" height="176" fill="#ffffff"/>
      <defs><marker id="a5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b3402a"/></marker></defs>
      <g font-size="11.5">
        <rect x="8" y="12" width="272" height="40" rx="7" fill="#fff" stroke="#d8d8d2"/>
        <text x="20" y="37" fill="#1a1a1a">the same mistake, again and again</text>
        <text x="266" y="37" fill="#b3402a" font-weight="700" text-anchor="end">✕3</text>
        <rect x="8" y="68" width="272" height="40" rx="7" fill="#fff" stroke="#d8d8d2"/>
        <text x="20" y="93" fill="#1a1a1a">work stalls, or goes in circles</text>
        <text x="266" y="93" fill="#b3402a" font-weight="700" text-anchor="end">✕2</text>
        <rect x="8" y="124" width="272" height="40" rx="7" fill="#fff" stroke="#d8d8d2"/>
        <text x="20" y="149" fill="#1a1a1a">results don't match the files</text>
        <text x="266" y="149" fill="#b3402a" font-weight="700" text-anchor="end">✕1</text>
      </g>
      <g stroke="#b3402a" stroke-width="1.4">
        <path d="M280,32 L340,70" fill="none" marker-end="url(#a5)"/>
        <line x1="280" y1="88" x2="340" y2="88" marker-end="url(#a5)"/>
        <path d="M280,144 L340,106" fill="none" marker-end="url(#a5)"/>
      </g>
      <g>
        <rect x="344" y="58" width="168" height="60" rx="8" fill="#fbeae6" stroke="#b3402a"/>
        <text x="428" y="84" font-size="12.5" font-weight="700" fill="#7a2a1c" text-anchor="middle">STOP AND RETHINK</text>
        <text x="428" y="102" font-size="10.5" fill="#7a2a1c" text-anchor="middle">the tally is written down</text>
      </g>
    </svg>