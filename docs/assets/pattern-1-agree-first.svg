<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 182" width="520" height="182" font-family="'IBM Plex Sans','Segoe UI',Helvetica,Arial,sans-serif" role="img" aria-label="You and the coordinator talk, then write the brief down; work starts after you approve it">
  <rect x="0" y="0" width="520" height="182" fill="#ffffff"/>
      <defs><marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d1f"/></marker></defs>
      <g>
        <rect x="8" y="18" width="130" height="56" rx="8" fill="#fafaf7" stroke="#d8d8d2"/>
        <text x="73" y="43" font-size="12.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">YOU</text>
        <text x="73" y="60" font-size="10.5" fill="#555" text-anchor="middle">what you want</text>
      </g>
      <g>
        <rect x="382" y="18" width="130" height="56" rx="8" fill="#fdf3d8" stroke="#c9a227"/>
        <text x="447" y="43" font-size="12.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">COORDINATOR</text>
        <text x="447" y="60" font-size="10.5" fill="#555" text-anchor="middle">questions, options</text>
      </g>
      <line x1="140" y1="46" x2="378" y2="46" stroke="#8a6d1f" stroke-width="1.5" marker-start="url(#a1)" marker-end="url(#a1)"/>
      <text x="260" y="36" font-size="11" fill="#555" text-anchor="middle">talk it through</text>
      <path d="M260,74 L260,100" stroke="#8a6d1f" stroke-width="1.5" marker-end="url(#a1)"/>
      <g>
        <rect x="150" y="104" width="220" height="50" rx="8" fill="#fff" stroke="#d8d8d2"/>
        <text x="260" y="126" font-size="12.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">THE BRIEF</text>
        <text x="260" y="143" font-size="10.5" fill="#555" text-anchor="middle">what will be built — and what will not</text>
      </g>
      <text x="260" y="172" font-size="11" fill="#8a6d1f" font-weight="700" text-anchor="middle">✓ approved by you → work starts</text>
    </svg>