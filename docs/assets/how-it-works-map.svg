<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 446" width="1160" height="446" font-family="'IBM Plex Sans','Segoe UI',Helvetica,Arial,sans-serif" role="img" aria-label="A map of the whole system with numbered badges showing where each of the six patterns sits">
  <rect x="0" y="0" width="1160" height="446" fill="#ffffff"/>
  <defs>
    <marker id="mArr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a6d1f"/>
    </marker>
  </defs>

  <!-- 5: counting rail across the top -->
  <rect x="20" y="12" width="1120" height="42" rx="9" fill="#fdf1ed" stroke="#d9a08c"/>
  <circle cx="46" cy="33" r="12" fill="#b3402a"/>
  <text x="46" y="38" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">5</text>
  <text x="70" y="30" font-size="12" font-weight="700" fill="#7a2a1c">TROUBLE IS SPOTTED BY COUNTING</text>
  <text x="70" y="47" font-size="11" fill="#7a2a1c">tallies watch every step below — the same mistake again ✕3 · work stalling ✕2 · results that don't match the files ✕1 — and a tripped tally stops the run</text>

  <!-- You <-> Coordinator, badge 1 on the link, badge 2 on the coordinator -->
  <g>
    <rect x="20" y="72" width="300" height="70" rx="10" fill="#fafaf7" stroke="#d8d8d2"/>
    <text x="38" y="100" font-size="14" font-weight="700" fill="#1a1a1a">YOU</text>
    <text x="38" y="119" font-size="11.5" fill="#555">you say what to build, approve the plan,</text>
    <text x="38" y="134" font-size="11.5" fill="#555">and make the final call on shipping</text>
  </g>
  <g>
    <rect x="356" y="72" width="784" height="70" rx="10" fill="#fdf3d8" stroke="#c9a227"/>
    <text x="374" y="100" font-size="14" font-weight="700" fill="#1a1a1a">THE COORDINATOR</text>
    <text x="374" y="119" font-size="11.5" fill="#555">plans the work, hands each step to a specialist, and checks every result against the actual files</text>
    <text x="374" y="134" font-size="11.5" fill="#555">keeps the whole job inside the time and cost limit you set at the start</text>
  </g>
  <line x1="320" y1="107" x2="352" y2="107" stroke="#8a6d1f" stroke-width="1.6" marker-start="url(#mArr)" marker-end="url(#mArr)"/>
  <circle cx="336" cy="107" r="12" fill="#c9a227"/>
  <text x="336" y="112" font-size="12" font-weight="700" fill="#1a1a1a" text-anchor="middle">1</text>
  <circle cx="356" cy="72" r="12" fill="#c9a227"/>
  <text x="356" y="77" font-size="12" font-weight="700" fill="#1a1a1a" text-anchor="middle">2</text>

  <!-- Specialists row (pattern 2's other half) -->
  <text x="20" y="172" font-size="12" font-weight="700" fill="#1a1a1a">THE SPECIALISTS</text>
  <text x="20" y="188" font-size="11" fill="#555">one owner per step</text>
  <line x1="748" y1="142" x2="748" y2="156" stroke="#8a6d1f" stroke-width="1.5" marker-end="url(#mArr)"/>
  <g font-size="11" text-anchor="middle">
    <rect x="356" y="158" width="118" height="36" rx="7" fill="#fff" stroke="#d8d8d2"/><text x="415" y="180" fill="#1a1a1a">spec writer</text>
    <rect x="482" y="158" width="118" height="36" rx="7" fill="#fff" stroke="#d8d8d2"/><text x="541" y="180" fill="#1a1a1a">set-up</text>
    <rect x="608" y="158" width="118" height="36" rx="7" fill="#fff" stroke="#d8d8d2"/><text x="667" y="180" fill="#1a1a1a">builder</text>
    <rect x="734" y="158" width="118" height="36" rx="7" fill="#fff" stroke="#d8d8d2"/><text x="793" y="180" fill="#1a1a1a">documenter</text>
    <rect x="860" y="158" width="118" height="36" rx="7" fill="#fff" stroke="#d8d8d2"/><text x="919" y="180" fill="#1a1a1a">reviewers</text>
    <rect x="986" y="158" width="154" height="36" rx="7" fill="#fff" stroke="#d8d8d2"/><text x="1063" y="180" fill="#1a1a1a">release packer</text>
  </g>

  <!-- Steps strip with badges 1, 3 and the fix-loop arc (4) -->
  <text x="20" y="234" font-size="12.5" font-weight="700" fill="#1a1a1a">THE WORK, STEP BY STEP</text>
  <path d="M744,252 L744,222 L520,222 L520,250" fill="none" stroke="#8a6d1f" stroke-width="1.5" marker-end="url(#mArr)"/>
  <circle cx="632" cy="222" r="12" fill="#c9a227"/>
  <text x="632" y="227" font-size="12" font-weight="700" fill="#1a1a1a" text-anchor="middle">4</text>
  <g font-size="11.5" text-anchor="middle">
    <g><rect x="20" y="252" width="104" height="52" rx="7" fill="#fff" stroke="#d8d8d2"/><text x="72" y="275" fill="#1a1a1a" font-weight="700">Agree</text><text x="72" y="291" fill="#555">the brief</text></g>
    <g><rect x="132" y="252" width="104" height="52" rx="7" fill="#fff" stroke="#d8d8d2"/><text x="184" y="275" fill="#1a1a1a" font-weight="700">Write</text><text x="184" y="291" fill="#555">the spec</text></g>
    <g><rect x="244" y="252" width="104" height="52" rx="7" fill="#fff" stroke="#d8d8d2"/><text x="296" y="282" fill="#1a1a1a" font-weight="700">Design</text></g>
    <g><rect x="356" y="252" width="104" height="52" rx="7" fill="#fff" stroke="#d8d8d2"/><text x="408" y="275" fill="#1a1a1a" font-weight="700">Set up</text><text x="408" y="291" fill="#555">from a template</text></g>
    <g><rect x="468" y="252" width="104" height="52" rx="7" fill="#fff" stroke="#d8d8d2"/><text x="520" y="282" fill="#1a1a1a" font-weight="700">Build</text></g>
    <g><rect x="580" y="252" width="104" height="52" rx="7" fill="#fff" stroke="#d8d8d2"/><text x="632" y="282" fill="#1a1a1a" font-weight="700">Document</text></g>
    <g><rect x="692" y="252" width="104" height="52" rx="7" fill="#fff" stroke="#d8d8d2"/><text x="744" y="275" fill="#1a1a1a" font-weight="700">Review</text><text x="744" y="291" fill="#555">independently</text></g>
    <g><rect x="804" y="252" width="104" height="52" rx="7" fill="#fff" stroke="#d8d8d2"/><text x="856" y="275" fill="#1a1a1a" font-weight="700">AI check</text><text x="856" y="291" fill="#555">if it uses AI</text></g>
    <g><rect x="916" y="252" width="104" height="52" rx="7" fill="#fdf3d8" stroke="#c9a227"/><text x="968" y="275" fill="#1a1a1a" font-weight="700">Ship</text><text x="968" y="291" fill="#555">your call</text></g>
    <g><rect x="1028" y="252" width="112" height="52" rx="7" fill="#fff" stroke="#d8d8d2"/><text x="1084" y="282" fill="#1a1a1a" font-weight="700">Look back</text></g>
  </g>
  <circle cx="20" cy="252" r="12" fill="#c9a227"/>
  <text x="20" y="257" font-size="12" font-weight="700" fill="#1a1a1a" text-anchor="middle">1</text>
  <circle cx="692" cy="252" r="12" fill="#c9a227"/>
  <text x="692" y="257" font-size="12" font-weight="700" fill="#1a1a1a" text-anchor="middle">3</text>

  <!-- every step writes down -->
  <g stroke="#bbb" stroke-width="1.2" stroke-dasharray="4 4">
    <line x1="72" y1="306" x2="72" y2="330"/>
    <line x1="408" y1="306" x2="408" y2="330"/>
    <line x1="744" y1="306" x2="744" y2="330"/>
    <line x1="1084" y1="306" x2="1084" y2="330"/>
  </g>

  <!-- 6: records foundation -->
  <rect x="20" y="332" width="1120" height="54" rx="9" fill="#fafaf7" stroke="#d8d8d2"/>
  <circle cx="46" cy="359" r="12" fill="#c9a227"/>
  <text x="46" y="364" font-size="12" font-weight="700" fill="#1a1a1a" text-anchor="middle">6</text>
  <text x="70" y="356" font-size="12" font-weight="700" fill="#1a1a1a">EVERYTHING IS WRITTEN DOWN</text>
  <text x="70" y="373" font-size="11" fill="#555">the brief · the state of the work · every problem and its evidence — files under every step, so any session can pick the run up where it stopped</text>

  <text x="20" y="422" font-size="12" fill="#555">Read it as layers: counting (5) watches from above, records (6) carry from below, and 1–4 sit on the people and steps where the work happens.</text>
</svg>