<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 196" width="520" height="196" font-family="'IBM Plex Sans','Segoe UI',Helvetica,Arial,sans-serif" role="img" aria-label="The coordinator hands each step to a specialist and takes the result back">
